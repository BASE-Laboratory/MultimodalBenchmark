name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      OMPI_MCA_btl_vader_single_copy_mechanism: none
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Fortran & OpenMPI for SMS (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran libopenmpi-dev openmpi-bin cmake ninja-build pkg-config

      - name: Install MultimodalBenchmark (with basecoat, SimpleITK, OpenImpala, and SMS on Linux)
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            python -m pip install -e ".[dev,mechanics]"
          else
            python -m pip install -e ".[dev]"
          fi

      - name: Check Layer 4 architectural import boundaries
        run: python -m basecoat.layers

      - name: Run unit & integration test suite
        env:
          OPENIMPALA_BACKEND: pure
        run: pytest -v

  zenodo-lightweight-gate:
    name: Lightweight Zenodo Fixture & Golden Thread Audit (ubuntu-latest, py3.11)
    runs-on: ubuntu-latest
    env:
      OMPI_MCA_btl_vader_single_copy_mechanism: none
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Fortran & OpenMPI for SMS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran libopenmpi-dev openmpi-bin cmake ninja-build pkg-config

      - name: Install MultimodalBenchmark (with OpenImpala and SMS)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mechanics]"

      - name: Fetch & MD5-verify lightweight (< 2 MB) Zenodo fixtures
        run: |
          mmbench verify-manifest --manifest configs/manifest.yaml --cache-dir data/cache/zenodo --download-lightweight
          python -c "
          import json, urllib.request
          from pathlib import Path
          cdir = Path('data/cache/zenodo')
          with urllib.request.urlopen('https://zenodo.org/api/records/13329639', timeout=30) as r:
              rec = json.loads(r.read().decode())
          for f in rec.get('files', []):
              k = f['key']
              if k.startswith('output_') and k.endswith('.nxs') and not (cdir / k).exists():
                  urllib.request.urlretrieve(f['links']['self'], cdir / k)
          "

      - name: Run full zero-skip pytest suite (Zenodo XRD-CT + joint OpenImpala & SMS Golden Thread)
        env:
          OPENIMPALA_BACKEND: pure
        run: |
          pytest -v -rs
          python -c "from multimodal_benchmark.metrics import is_sms_available; assert is_sms_available(), 'Expected compiled SMS on ubuntu-latest'"
