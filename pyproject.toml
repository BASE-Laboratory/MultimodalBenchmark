[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-benchmark"
version = "2.0.0"
description = "Standardized multi-resolution synchrotron XCT + XRD-CT benchmark suite for super-resolution, correlative chemical fusion, segmentation, and OpenImpala transport physics."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Calum Green" },
  { name = "James Le Houx" },
]
keywords = [
  "synchrotron",
  "tomography",
  "XCT",
  "XRD-CT",
  "super-resolution",
  "multimodal-fusion",
  "benchmark",
  "zeolite-13X",
  "openimpala",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "h5py>=3.8",
  "tifffile>=2023.7.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
registration = [
  "SimpleITK>=2.3",
  "matplotlib>=3.7",
]
transport = [
  "openimpala>=4.6.0",
]
notebooks = [
  "matplotlib>=3.7",
  "jupyter>=1.0",
]
dev = [
  "pytest>=7.4",
  "SimpleITK>=2.3",
  "matplotlib>=3.7",
  "openimpala>=4.6.0",
]

[project.scripts]
mmbench = "multimodal_benchmark.cli:main"
mmbench-evaluate = "multimodal_benchmark.cli:main_evaluate"
mmbench-audit = "multimodal_benchmark.cli:main_audit"
mmbench-splits = "multimodal_benchmark.cli:main_splits"

[tool.setuptools.package-dir]
"" = "."
"multimodal_benchmark" = "src/multimodal_benchmark"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["multimodal_benchmark*", "registration*", "preprocessing*", "tasks*", "splits*", "baselines*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
