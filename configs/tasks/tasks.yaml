# Zn-13X-Bench Formal Task Specifications (NeurIPS Datasets & Benchmarks Edition)
# Three core tasks (T1, T2, T3) + one optional extension (T4).
# Artifact removal and standalone segmentation are NOT benchmark tasks; preprocessing is shipped
# strictly as a documented secondary track, and segmentation is folded into T1 OpenImpala scoring.

reference_tracks:
  raw_float32:
    version: "1.0"
    role: "primary"
    description: >
      Registered, UNCLEANED 32-bit float reconstructed sub-volumes (Zenodo 12206815, 13327651, 13327682,
      13327692, 13349402) resampled strictly via frozen 7-DOF transforms (`configs/i13_benchmark_transforms.json`).
      Primary reference for all tasks; 8-bit Zenodo 14245751 previews are never used for scoring.
  cleaned_dering_v1:
    version: "1.0-frozen"
    role: "secondary_optional"
    description: >
      Same sub-volumes after frozen conservative polar de-ringing (`remove_rings_polar_conservative`), ruby z-slab
      validity masking (`clean_z_mask`), and XRD-CT 0/360 closure & conjugate COR fixes, published with exact
      difference maps. Polynomial radial cupping detrending and axial z-detrending are excluded because empirical
      checks against 25 um XRD-CT prove they absorb real Zn/Na core-shell and axial chemistry.

headline_experiment:
  name: "Physics-Scored Synchrotron Super-Resolution: Domain Shift vs. Registration Jitter"
  primary_tracks: ["2p026x"]
  exploratory_tracks: ["8p101x"]
  seeds: [42, 137, 2026]
  training_regimes:
    synthetic_clean: "HR rung blurred + downsampled at exact true magnification ratio (0 registration jitter)"
    synthetic_noisy: "HR rung blurred + downsampled + calibrated sCMOS noise (0 registration jitter)"
    synthetic_jittered: "Control: HR rung blurred + downsampled + sCMOS noise + matched ~2.5 HR-voxel 3D registration jitter"
    real_paired: "Measured lower-resolution rung aligned via 7-DOF transform (refitted on 32-bit float)"
  evaluation_target: "Real paired test slabs only (OpenImpala PDE transport + threshold sensitivity + image metrics)"

tasks:
  t1:
    name: "T1: Real-Pair Synchrotron XCT Super-Resolution"
    beamline: "DLS I13-2"
    primary_reference_track: "raw_float32"
    secondary_reference_track: "cleaned_dering_v1"
    input_modality: "Lower-resolution I13-2 float32 rung at true magnification ratios (1.604x, 2.026x, 2.493x, 5.051x; exploratory 8.101x)"
    target_modality: "Higher-resolution I13-2 float32 rung resampled via 32-bit-refitted 7-DOF transform"
    baselines: ["Tricubic", "SRResNet-2.5D", "SwinIR-2.5D (L1)", "OpenLSR-X (SwinIR + Conservation/Topology)"]
    threshold_rule: >
      One fixed Otsu threshold calibrated on the reference volume is applied identically to affine-aligned
      prediction and reference volumes before OpenImpala PDE scoring, with +/-5% dynamic-range sensitivity reported.
    tracks:
      1p604x:
        role: "core"
        lr_scan: "169068"
        lr_voxel_um: 2.6
        ruby_scaled_lr_voxel_um: 2.5945
        hr_scan: "169067"
        hr_voxel_um: 1.625
        ruby_scaled_hr_voxel_um: 1.6212
        true_scale_ratio: 1.6039
      2p026x:
        role: "core_headline"
        lr_scan: "169067"
        lr_voxel_um: 1.625
        ruby_scaled_lr_voxel_um: 1.6212
        hr_scan: "169066"
        hr_voxel_um: 0.8125
        ruby_scaled_hr_voxel_um: 0.8006
        true_scale_ratio: 2.0258
      2p493x:
        role: "core"
        lr_scan: "169066"
        lr_voxel_um: 0.8125
        ruby_scaled_lr_voxel_um: 0.8006
        hr_scan: "169065"
        hr_voxel_um: 0.325
        ruby_scaled_hr_voxel_um: 0.3211
        true_scale_ratio: 2.4934
      5p051x:
        role: "core"
        lr_scan: "169067"
        lr_voxel_um: 1.625
        ruby_scaled_lr_voxel_um: 1.6212
        hr_scan: "169065"
        hr_voxel_um: 0.325
        ruby_scaled_hr_voxel_um: 0.3211
        true_scale_ratio: 5.0511
      8p101x:
        role: "exploratory"
        lr_scan: "169068"
        lr_voxel_um: 2.6
        ruby_scaled_lr_voxel_um: 2.5945
        hr_scan: "169065"
        hr_voxel_um: 0.325
        ruby_scaled_hr_voxel_um: 0.3211
        true_scale_ratio: 8.1014
        transform_composition: "chained_adjacent_7dof_only_exploratory"
    required_keys: ["pred"]
    primary_metrics: ["d_eff_rel_err", "tortuosity_rel_err", "ssa_rel_err", "porosity_abs_err", "psnr_db", "ssim", "fsc_0p5_cyc_per_vox"]

  t2:
    name: "T2: Chemical Super-Resolution and Fusion"
    beamline: "DLS K11 (DIAD)"
    primary_reference_track: "raw_float32"
    secondary_reference_track: "cleaned_dering_v1"
    split_protocol: "leave_one_slice_out_4fold_cv"
    statistical_footprint_note: "4 paired slices of 40x40 (~2,200 in-pellet pixels total); favors zero-shot / self-supervised forward-PSF fusion (X-FUSE, Guided Filter) over large supervised models."
    input_modalities: ["50 um DIAD XRD-CT Na/Zn maps (+47.5 deg corrected)", "Co-registered 0.54 um DIAD float32 XCT"]
    target_modality: "25 um DIAD XRD-CT reference maps at z = 9, 14, 17, 18 (43324, 43322, 43323, 43325)"
    baselines: ["Bicubic", "Guided Filter", "X-FUSE (2D JBU-Gating)", "X-FUSE (2D Cross-Attn)", "X-FUSE (3D LOSO Triplane)"]
    evaluation_cutoff_cyc_per_px: 0.43
    resolution_ratio_summary:
      mean_25um_raw_half_frc0p5_um: 64.3
      mean_25um_full_sb_frc0p5_um: 58.5
      mean_25um_half_bit_um: 57.9
      mean_50um_raw_half_frc0p5_um: 120.1
      mean_50um_full_sb_frc0p5_um: 103.6
      mean_50um_half_bit_um: 111.5
      true_resolution_ratio_sb0p5: 1.79
      true_resolution_ratio_half_bit: 1.93
    paired_slices:
      43324: {scan_50um: 43345, z_index: 9, zn_fraction: 0.991, margin_dr: 0.0052, status: "CONFIRM_STAGE_Z_ON_SCARF"}
      43322: {scan_50um: 43395, z_index: 14, zn_fraction: 0.624, margin_dr: 0.0180, status: "CLEAR_MARGIN"}
      43323: {scan_50um: 43398, z_index: 17, zn_fraction: 0.252, margin_dr: 0.0140, status: "CLEAR_MARGIN"}
      43325: {scan_50um: 43399, z_index: 18, zn_fraction: 0.096, margin_dr: 0.0254, status: "CLEAR_MARGIN"}
    required_keys: ["zn", "na"]
    primary_metrics: ["mean_bandlimited_rmse", "in_pellet_na_zn_corr_abs_err", "reaction_front_pos_err_um"]
    secondary_metrics: ["mean_bandlimited_reduced_chi2"]

  t3:
    name: "T3: Cross-Beamline Tomographic Registration"
    beamline: "DLS I13-2 <-> DLS K11 (DIAD)"
    gated_on_stage0c: true
    primary_reference_track: "raw_float32"
    secondary_reference_track: "cleaned_dering_v1"
    input_modalities: ["Unaligned I13-2 1.625 um float32 XCT (169067)", "Unaligned DIAD 0.54 um float32 XCT (k11-43334)"]
    target_modality: "Fiducial-verified 7-DOF similarity transform from Stage 0C (pending SCARF/Hamilton execution)"
    baselines: ["3-DOF Rigid", "7-DOF NMI", "VoxelMorph"]
    required_keys: ["mapped_fiducials_xyz_um"]
    primary_metrics: ["fiducial_tre_mean_um", "fiducial_tre_p95_um", "scale_rel_err_pct", "octant_residual_drift_mean_um"]

  t4:
    name: "T4: Sparse-View XRD-CT Reconstruction (Optional Extension)"
    optional_extension: true
    beamline: "DLS K11 (DIAD)"
    primary_reference_track: "raw_float32"
    secondary_reference_track: "cleaned_dering_v1"
    input_modality: "Angularly subsampled 25 um XRD-CT sinograms (e.g. 20 or 40 projections out of 79 unique angles)"
    target_modality: "Full 40 x 79 continuum-subtracted 25 um XRD-CT reconstruction"
    baselines: ["FBP", "SIRT", "U-Net Post-Processing"]
    required_keys: ["recon"]
    primary_metrics: ["reduced_chi2", "rmse", "frc_0p5_cyc_per_px", "frc_full_sb_0p5_cyc_per_px"]
