# Canonical Zenodo & NeXus/HDF5 Dataset Manifest
# Companion to Green et al., Scientific Data 12, 329 (2025)
# https://doi.org/10.1038/s41597-025-04605-9

schema_version: "2.0.0"
dataset_name: "Zn-Doped Zeolite 13X Multimodal Synchrotron XCT & XRD-CT Benchmark"
repository_url: "https://github.com/BASE-Laboratory/MultimodalBenchmark"
paper:
  title: "Three-dimensional, multimodal synchrotron data for machine learning applications"
  authors:
    - "Calum Green"
    - "Sharif Ahmed"
    - "Shashidhara Marathe"
    - "Liam Perera"
    - "Alberto Leonardi"
    - "Killian Gmyrek"
    - "Daniele Dini"
    - "James Le Houx"
  journal: "Scientific Data"
  volume: 12
  article: 329
  year: 2025
  doi: "10.1038/s41597-025-04605-9"
  preprint_arxiv: "2409.07322"

errata_notes:
  broken_paper_doi:
    cited_in_body_text: "10.5281/zenodo.13327988"
    http_status: 404
    resolved_doi: "10.5281/zenodo.13349402"
    note: >
      Body text of Green et al. (2025) cites 10.5281/zenodo.13327988 for the
      reconstructed DIAD 0.54 um XCT volume, which returns HTTP 404 on Zenodo.
      Reference 18 (10.5281/zenodo.13349402) is the active published record.
  pixel_size_typo:
    legacy_readme_value_um: 0.3125
    true_value_um: 0.325
    scan_id: "169065"
  xrdct_scan_inventory:
    note: >
      Zenodo record 13329639 contains FOUR 25 um XRD-CT sinogram scans
      (k11-43322 with 79 projections; k11-43323, k11-43324, k11-43325 with 80 projections)
      plus pre-reconstructed multi-peak NeXus maps output_43322..43325_{na,zn}.nxs,
      and TWENTY-ONE 50 um sinogram scans across two non-contiguous scan blocks
      (k11-43336..43347 and k11-43393..43401; output_*_{na,zn}.nxs present for 43336..43347 and 43393..43400).
  xrdct_50um_motor_zero_rotation:
    gts_cs_theta_25um_deg: [0.0, 360.0]
    gts_cs_theta_50um_deg: [-47.5, 312.5]
    legacy_50um_correction_deg: 47.5
    matched_50um_indices_for_25um:
      "43324": {"index": 9, "scan_id": 43345, "zn_phase_fraction_calibrated": 0.991, "zn_na_ratio_legacy": 2.597}
      "43322": {"index": 14, "scan_id": 43395, "zn_phase_fraction_calibrated": 0.624, "zn_na_ratio_legacy": 0.901}
      "43323": {"index": 17, "scan_id": 43398, "zn_phase_fraction_calibrated": 0.252, "zn_na_ratio_legacy": 0.686}
      "43325": {"index": 18, "scan_id": 43399, "zn_phase_fraction_calibrated": 0.096, "zn_na_ratio_legacy": 0.731}
    note: >
      Between k11-43325 (25 um) and k11-43336 (50 um), the gts_cs_theta soft-motor zero was shifted by -47.5 deg
      while keeping the physical sample start orientation identical (mean-subtracted sinogram r = 0.9956 between
      k11-43324 and k11-43345 at frame 0). Passing gts_cs_theta directly to tomopy.recon rotated all published
      output_43336..43400_{na,zn}.nxs slices by -47.5 deg relative to the 25 um ROI maps. Furthermore, kb_cs_x
      spans [377.72, 2183.28] DIAD 0.54 um XCT pixels (center 1280.50 px, span 975.0 um -> 25.00 um step at 40
      translations, 51.316 um step at 20 translations), and Rigaku Cu-Ka powder references exhibit a -0.00125 A^-1
      zero-point q-shift relative to the DIAD Pilatus3X CdTe q-grid.

