  capillary:
    material: "borosilicate_glass"
    outer_diameter_um: 1000.0
  pellet:
    material: "Zn-doped Zeolite 13X (binderless)"
    phases: ["Pore", "Na-13X", "Zn-13X"]
    characteristic_doublet_q_inv_angstrom:
      na_13x: 1.651
      zn_13x: 1.656
  calibration_spheres:
    ruby_sphere_diameter_um: 500.0
    nist_borosilicate_beads_diameter_range_um: [100.0, 400.0]

